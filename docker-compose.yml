  tb_cluster1:
    image: tiktuzki/tb-node:demo
    container_name: tb_cluster1
    security_opt:
      - seccomp=unconfined
    cap_add:
      - IPC_LOCK
    entrypoint: [ "tb-manager-node" ]
    ports:
      - "9002:9002"
      - "3003:3003"
    command:
      - "--backup-config-file"
      - "./backup_config.toml"
      - "--grpc-port=9002"
      - "--exe=tigerbeetle"
      - "--"
      - "start"
      - "--addresses=0.0.0.0:3003"
      - "/data/0.tb"
    volumes:
      - ./data:/data
    networks:
      default:
        ipv4_address: 172.30.0.11
    restart: unless-stopped
networks:
  default:
    name: ledger-network
    ipam:
      config:
        - subnet: 172.30.0.0/24
